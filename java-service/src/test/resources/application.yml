# ─────────────────────────────────────────────────────────────────────────────
# Test Configuration
# Used by Spring Boot tests (JUnit/MockMvc) to run without a real database.
# H2 in-memory database simulates PostgreSQL for fast, isolated unit tests.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Disable Flyway/Liquibase if added later during tests
  flyway:
    enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# Spring Boot Application Configuration
# ─────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: java-analytics-service

  # ─── Database (PostgreSQL) ───────────────────────────────────────────────
  # Connection values are injected via environment variables so the same
  # image runs in dev (local .env) and production (cloud secrets).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devopsdb}
    username: ${SPRING_DATASOURCE_USERNAME:devops_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme_in_production}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      # Retry logic: attempt to acquire connection before failing startup
      initialization-fail-timeout: 60000

  # ─── JPA / Hibernate ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ─── Spring Boot Actuator ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# ─── Application Info (exposed via /actuator/info) ────────────────────────────
info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: Multi-Service CI/CD Platform — Java Analytics Microservice
    environment: ${APP_ENV:development}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.devops.platform: DEBUG
    # Suppress noisy Hibernate startup logs in production
    org.hibernate.tool.schema: WARN
    org.hibernate.orm.connections: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ─────────────────────────────────────────────────────────────────────────────
# Docker Compose — Multi-Service CI/CD Automation Platform
#
# Services:
#   - postgres       : PostgreSQL 15 database (internal only, port 5432)
#   - java-service   : Spring Boot Analytics Microservice (port 8080)
#   - node-service   : Node.js API Gateway (port 3000)
#
# Usage:
#   docker compose up --build       # Build and start all services
#   docker compose down -v          # Stop and remove containers + volumes
#   docker compose logs -f          # Follow logs from all services
# ─────────────────────────────────────────────────────────────────────────────


# ─── Shared Network ───────────────────────────────────────────────────────────
networks:
  devops-network:
    driver: bridge
    name: devops-platform-network

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  postgres-data:          # Persistent database storage
  node-logs:
  java-logs:
  prometheus-data:
  grafana-data:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: devops-postgres
    restart: unless-stopped
    environment:
      # Use explicit env vars — Docker Compose variable substitution in
      # CMD-SHELL healthcheck arrays requires plain env vars, not ${:-} syntax
      POSTGRES_DB: ${POSTGRES_DB:-devopsdb}
      POSTGRES_USER: ${POSTGRES_USER:-devops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devops-network
    healthcheck:
      # Use POSTGRES_USER/POSTGRES_DB env vars which are directly set above —
      # pg_isready reads PGUSER / PGDATABASE from the container environment
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "com.devops.service=postgres"
      - "com.devops.version=15"

  # ── Java Spring Boot Analytics Microservice ──────────────────────────────
  java-service:
    build:
      context: ./java-service
      dockerfile: Dockerfile
      target: production
    image: devops-platform/java-service:latest
    container_name: java-analytics-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=${APP_ENV:-production}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devopsdb}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-devops_admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_production}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${JPA_DDL_AUTO:-update}
    volumes:
      - java-logs:/app/logs
    networks:
      - devops-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # wget is available in eclipse-temurin:17-jre-alpine via busybox
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    labels:
      - "com.devops.service=java-analytics"
      - "com.devops.version=1.0.0"

  # ── Node.js API Gateway ──────────────────────────────────────────────────
  node-service:
    build:
      context: ./node-service
      dockerfile: Dockerfile
      target: production
    image: devops-platform/node-service:latest
    container_name: node-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-devops-platform-secret-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - JAVA_SERVICE_URL=http://java-service:8080
      - JAVA_REQUEST_TIMEOUT=5000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-devops_admin}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-devopsdb}
    volumes:
      - node-logs:/app/logs
    networks:
      - devops-network
    depends_on:
      java-service:
        condition: service_healthy
    healthcheck:
      # wget is available in node:18-alpine via busybox
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "com.devops.service=node-api-gateway"
      - "com.devops.version=1.0.0"

  # ── React Frontend Dashboard ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: react-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    networks:
      - devops-network
    depends_on:
      node-service:
        condition: service_healthy
    labels:
      - "com.devops.service=react-frontend"
      - "com.devops.version=1.0.0"

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - devops-network
    depends_on:
      - frontend
      - node-service
    labels:
      - "com.devops.service=nginx-proxy"

  # ── Prometheus Monitoring ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - devops-network
    labels:
      - "com.devops.service=prometheus"

  # ── Grafana Dashboards ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - devops-network
    depends_on:
      - prometheus
    labels:
      - "com.devops.service=grafana"

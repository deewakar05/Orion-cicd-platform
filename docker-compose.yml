# ─────────────────────────────────────────────────────────────────────────────
# Docker Compose — Multi-Service CI/CD Automation Platform
#
# Services:
#   - node-service   : Node.js API Gateway (port 3000)
#   - java-service   : Spring Boot Analytics Microservice (port 8080)
#
# Usage:
#   docker compose up --build       # Build and start all services
#   docker compose down             # Stop and remove containers
#   docker compose logs -f          # Follow logs from all services
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

# ─── Shared Network ───────────────────────────────────────────────────────────
networks:
  devops-network:
    driver: bridge
    name: devops-platform-network

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  node-logs:
  java-logs:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Java Spring Boot Analytics Microservice ──────────────────────────────
  java-service:
    build:
      context: ./java-service
      dockerfile: Dockerfile
      target: production
    image: devops-platform/java-service:latest
    container_name: java-analytics-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=${APP_ENV:-production}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
    volumes:
      - java-logs:/app/logs
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "com.devops.service=java-analytics"
      - "com.devops.version=1.0.0"

  # ── Node.js API Gateway ──────────────────────────────────────────────────
  node-service:
    build:
      context: ./node-service
      dockerfile: Dockerfile
      target: production
    image: devops-platform/node-service:latest
    container_name: node-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-devops-platform-secret-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - JAVA_SERVICE_URL=http://java-service:8080
      - JAVA_REQUEST_TIMEOUT=5000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - node-logs:/app/logs
    networks:
      - devops-network
    depends_on:
      java-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "com.devops.service=node-api-gateway"
      - "com.devops.version=1.0.0"
